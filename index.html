<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dootu</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Montserrat 800 entra por causa da PREVIA da legenda do Estudio: o estilo `impacto`
       e desenhado nela, e uma previa em Inter mentiria sobre a largura do desenho, que e
       justamente o que muda de um estilo para o outro. Um peso so, subset latino: a mesma
       disciplina do `loadFont` do Clip.jsx, e nenhuma dependencia nova (BP-005). -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@800&display=swap" rel="stylesheet">
  <!-- Aparência (Preto + gelo · Grafite · Claro). Síncrono e no <head> de propósito: põe
       <html data-appearance> ANTES do primeiro paint, senão a tela pisca no tema errado. -->
  <script src="appearance.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* A lista aberta do <select> é desenhada pelo browser e NÃO herda o tema: sem
       isto ela nasce clara e recebe o --text quase branco do site, então só dava
       pra ler a opção sob o cursor (a única com realce). `color-scheme: dark` manda
       o browser pintar a lista, a barra de rolagem e o realce na variante escura;
       o par option é o mesmo já usado em `.field select option`. Global de propósito:
       o defeito era idêntico no Faturador e na Precificação. */
    select { color-scheme: dark; }
    /* No preset Claro a lista do browser tem de ser clara pelo mesmo motivo do comentário
       acima — o realce e a barra de rolagem vêm do color-scheme, não do nosso CSS. */
    html[data-appearance="claro"] select { color-scheme: light; }
    select option { background: var(--surface); color: var(--text); }

    :root {
      /* ── Tema esportivo (basquete) — trocável por time ──
         Time atual: Washington Wizards (vermelho/navy/prata — cores oficiais).
         Para trocar de time, basta alterar --team-* abaixo; o resto do app segue. */
      --team-navy:        #002B5C;  /* navy oficial Wizards */
      --team-navy-bright: #2E6FE0;  /* navy clareado — legível sobre fundo escuro */
      --team-red:         #E31837;  /* vermelho oficial Wizards (accent primário) */
      --team-red-hot:     #FF2E4D;  /* vermelho quente — hover/realce */
      --team-silver:      #C4CED4;  /* prata oficial Wizards */
      /* Imagens do tema — trocam junto com as cores na alternância de jogo */
      --img-bg:      url('assets/capa-bg.jpg');
      --img-sidebar: url('assets/capa-sidebar.jpg');
      --img-logo:    url('assets/favicon.png');

      /* ── Black + Ice ──
         A interface e neutra. Os --team-* acima seguem valendo para o placar ao vivo
         (identidade do time e conteudo), mas nao alimentam mais o accent: era por ali
         que a cor do tema vazava para botao, selecao e fundo do site inteiro. */
      --bg:         #111113;
      --bg-subtle:  #0B0B0D;
      --surface:    #1C1C20;
      --surface-2:  #151518;
      --surface-3:  #303038;
      --border:     #35353D;
      --border-hover: #4A4A55;
      --border-strong: #67676F;
      --accent:     #E5E5EB;
      --accent-ink: #17171B;
      --accent-hover: #FFFFFF;
      --accent-2:   #C9C8D1;
      --accent-3:   #ACABB3;
      --accent-pink:#FFFFFF;
      --accent-dim: rgba(229,229,235,.10);
      --accent-dim2:rgba(229,229,235,.07);
      --gradient:   var(--bg-subtle);
      --gradient-subtle: var(--surface-2);
      /* Sem glow: profundidade e sombra contida, definida junto do componente */
      --glow-blue:  none;
      --glow-accent:none;
      --text:       #F3F3F5;
      --text-dim:   #ACABB3;
      --text-muted: #8A8992;
      --danger:     #F0A0A0;
      --danger-dim: rgba(240,160,160,.12);
      --success:    #C9D4DE;
      --success-dim:rgba(201,212,222,.10);
      --star:       #D9A441;
      --radius-sm:  8px;
      --radius:     12px;
      --radius-lg:  16px;
      --radius-xl:  24px;
      --sidebar-w:  250px;
      --header-h:   64px;
      --ease:       200ms cubic-bezier(.4,0,.2,1);
      --ease-spring:300ms cubic-bezier(.175,.885,.32,1.275);
      /* ── Motion tokens (Emil Kowalski: spring + percepção de velocidade) ── */
      --dur-1:      140ms;
      --dur-2:      220ms;
      --dur-3:      360ms;
      --spring-fast: cubic-bezier(.34,1.56,.64,1);   /* overshoot suave */
      --spring-soft: cubic-bezier(.22,1,.36,1);       /* assenta sem estourar */
      --font-display: 'Saira Condensed', 'Inter', system-ui, sans-serif;
    }

    /* Acessibilidade: respeita quem desativa animações no SO */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
        scroll-behavior: auto !important;
      }
    }


    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* O halo radial vermelho/azul saiu junto com o accent colorido: o fundo do app é
       chapado (--bg). Sobrou só a textura de quadra abaixo, que é cinza e não tem cor. */
    /* Linhas de quadra sutis (motivo genérico de basquete, não-marca) */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image:
        repeating-linear-gradient(90deg, transparent 0 119px, rgba(190,192,194,.035) 119px 120px),
        repeating-linear-gradient(0deg, transparent 0 119px, rgba(190,192,194,.025) 119px 120px);
      mask-image: radial-gradient(ellipse 90% 80% at 50% 40%, #000 0%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse 90% 80% at 50% 40%, #000 0%, transparent 75%);
      pointer-events: none; z-index: 0;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--veil-strong); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

    /* ── KEYFRAMES ── */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 12px rgba(227,24,55,.08); }
      50% { box-shadow: 0 0 24px rgba(227,24,55,.16); }
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ── HEADER ── */
    #header {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--header-h);
      background: rgba(26,26,35,.82);
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 16px; padding: 0 24px;
      z-index: 100;
    }
    .logo {
      display: flex; align-items: center; gap: 11px;
      font-family: var(--font-display);
      font-weight: 800; font-size: 22px; color: var(--text);
      white-space: nowrap; min-width: calc(var(--sidebar-w) - 24px);
      flex-shrink: 0; letter-spacing: .04em; text-transform: uppercase;
      appearance: none; border: 1px solid transparent; background: transparent;
      border-radius: var(--radius-xl); padding: 4px 8px 4px 4px;
      cursor: pointer; text-align: left;
      transition: background-color var(--dur-1) var(--spring-soft),
                  border-color var(--dur-1) var(--spring-soft),
                  transform var(--dur-1) var(--spring-soft);
    }
    .logo-icon {
      width: 34px; height: 34px; flex-shrink: 0;
      border-radius: 50%; background: var(--img-logo) center/cover no-repeat #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,.35), 0 0 0 1px var(--team-silver);
      transition: transform var(--dur-2) var(--spring-soft);
    }
    .logo[aria-expanded="true"] {
      background: var(--accent-dim);
      border-color: var(--border-hover);
    }
    .logo:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .logo:active { transform: scale(.97); }
    @media (hover: hover) and (pointer: fine) {
      .logo:hover { background: var(--veil); border-color: var(--border); }
      .logo:hover .logo-icon { transform: scale(1.06); }
    }
    @media (max-width: 900px) {
      .logo { min-width: 44px; padding-right: 4px; }
      .logo-name { display: none; }
    }






    /* ── BUTTONS ── */
    .btn-primary {
      background: var(--gradient);
      color: var(--accent-ink); border: none;
      border-radius: var(--radius-xl); padding: 10px 22px;
      font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
      transition: transform var(--dur-1) var(--spring-soft), box-shadow var(--dur-2) var(--ease);
      box-shadow: 0 1px 2px rgba(0,0,0,.3);
      position: relative; overflow: hidden;
    }
    .btn-primary::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.14) 0%, transparent 50%);
      opacity: 0; transition: opacity var(--dur-2) var(--ease);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(0,0,0,.34);
    }
    .btn-primary:hover::before { opacity: 1; }
    .btn-primary:active { transform: scale(.97); }

    .btn-ghost {
      background: var(--veil); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 9px 18px;
      font-size: 14px; color: var(--text-dim); cursor: pointer;
      transition: background-color var(--ease), color var(--ease), border-color var(--ease), transform var(--dur-1) var(--spring-soft);
    }
    .btn-ghost:hover { background: var(--veil-strong); color: var(--text); border-color: var(--border-hover); }
    .btn-ghost:active { transform: scale(.97); }

    .btn-danger {
      background: linear-gradient(135deg, #f28b82, #ee675c); color: #1a1a23; border: none;
      border-radius: var(--radius); padding: 9px 18px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: transform var(--dur-1) var(--spring-soft), box-shadow var(--dur-2) var(--ease);
      box-shadow: 0 2px 12px rgba(242,139,130,.2);
    }
    .btn-danger:hover { transform: translateY(-1px); box-shadow: 0 4px 18px rgba(242,139,130,.3); }
    .btn-danger:active { transform: scale(.97); }

    /* ── LAYOUT ── */
    #app { padding-top: var(--header-h); height: 100vh; display: flex; position: relative; z-index: 1; }
    .layout { display: flex; flex: 1; overflow: hidden; position: relative; }

    /* ── SIDEBAR ── */
    #sidebar {
      width: var(--sidebar-w); flex-shrink: 0;
      position: absolute; inset: 0 auto 0 0; z-index: 90;
      background: rgba(26,26,35,.6);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-right: 1px solid var(--border);
      overflow-y: auto; padding: 14px 0 28px;
      display: flex; flex-direction: column; gap: 2px;
      max-width: calc(100vw - 24px);
      transform: translateX(-100%);
      visibility: hidden; pointer-events: none;
      box-shadow: 14px 0 30px -18px rgba(0,0,0,.8);
      transition: transform 240ms cubic-bezier(.32,.72,0,1),
                  visibility 0s linear 240ms;
    }
    .layout.sidebar-open #sidebar {
      transform: translateX(0);
      visibility: visible; pointer-events: auto;
      transition: transform 240ms cubic-bezier(.32,.72,0,1),
                  visibility 0s linear 0s;
    }
    .layout.sidebar-instant #sidebar { transition: none; }
    /* Faixa de marca Wizards no topo da sidebar (arte contida + overlay p/ legibilidade) */
    .sidebar-brand {
      position: relative; flex-shrink: 0;
      height: 102px; margin: -14px 0 12px;
      background: var(--img-sidebar) center/cover no-repeat;
      display: flex; align-items: flex-end;
      border-bottom: 1px solid var(--border);
    }
    .nav-section { padding: 0 10px; }
    .nav-item {
      position: relative;
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 10px 12px; border-radius: var(--radius);
      border: none; background: transparent; color: var(--text-dim);
      font-size: 14px; cursor: pointer; text-align: left;
      transition: background var(--dur-2) var(--spring-soft),
                  color var(--dur-1) ease,
                  transform var(--dur-2) var(--spring-fast);
      font-family: inherit;
    }
    /* Barra-indicador que cresce a partir do centro ao ativar */
    .nav-item::before {
      content: ''; position: absolute; left: 0; top: 50%;
      width: 3px; height: 0; border-radius: 0 3px 3px 0;
      background: var(--accent); transform: translateY(-50%);
      transition: height var(--dur-2) var(--spring-fast);
    }
    .nav-item:hover { background: var(--veil); color: var(--text); transform: translateX(2px); }
    .nav-item.active {
      background: var(--accent-dim);
      color: var(--accent);
      font-weight: 600;
    }
    .nav-item.active::before { height: 60%; }
    .nav-count {
      margin-left: auto; font-family: var(--font-display);
      font-size: 13px; font-weight: 700; letter-spacing: .02em;
      background: var(--veil); border-radius: 20px;
      padding: 1px 9px; color: var(--text-muted);
      transition: transform var(--dur-2) var(--spring-fast), color var(--dur-1) ease;
    }
    .nav-item.active .nav-count { background: var(--veil-strong); color: var(--text); }
    /* Pulso quando a contagem muda (classe adicionada via JS) */

    /* Entrada escalonada dos itens da nav */
    .nav-section .nav-item { animation: fadeInUp var(--dur-3) var(--spring-soft) both; }
    .nav-section .nav-item:nth-child(1) { animation-delay: .02s; }
    .nav-section .nav-item:nth-child(2) { animation-delay: .06s; }
    .nav-section .nav-item:nth-child(3) { animation-delay: .10s; }
    .nav-section .nav-item:nth-child(4) { animation-delay: .14s; }
    .nav-section .nav-item:nth-child(5) { animation-delay: .18s; }
    .nav-section .nav-item:nth-child(6) { animation-delay: .22s; }















    /* ── PROJECTS ── */




















    /* ── MAIN ── */
    #main {
      flex: 1; overflow-y: auto; padding: 28px;
      /* Fundo de marca Wizards atrás de TODAS as views. SEM 'fixed' → o brasão
         centraliza DENTRO da área de conteúdo (com 'fixed' ele se prende à janela
         inteira e fica deslocado pela sidebar/header). Cards têm blur+.7 → texto legível. */
      background:
        linear-gradient(rgba(13,17,23,.85), rgba(13,17,23,.90)),
        var(--img-bg) center center / cover no-repeat;
    }

    /* ── TOAST ── */
    #toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(70px);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl); padding: 12px 24px;
      font-size: 14px; color: var(--text);
      box-shadow: 0 12px 40px rgba(0,0,0,.4);
      opacity: 0; pointer-events: none; white-space: nowrap;
      transition: transform 300ms cubic-bezier(.175,.885,.32,1.275), opacity 200ms ease;
      z-index: 400;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* Créditos do projeto */
    #site-credits {
      position: fixed; z-index: 50; left: 14px; bottom: 12px;
      display: grid; gap: 2px; max-width: calc(100vw - 28px);
      color: var(--text-muted); font-size: 10.5px; line-height: 1.35;
      letter-spacing: .01em; pointer-events: none; user-select: none;
    }
    #site-credits b { color: var(--text-dim); font-weight: 700; }
    @media (max-width: 600px) { #site-credits { left: 10px; bottom: 8px; font-size: 9.5px; } }
  </style>
</head>

<!-- ── MODAL ── -->
<script id="sidebar-drawer-script">
  (() => {
    const layout = document.querySelector('.layout');
    const sidebar = document.getElementById('sidebar');
    const toggle = document.getElementById('sidebar-toggle');
    if (!layout || !sidebar || !toggle) return;

    toggle.addEventListener('click', event => {
      const open = !layout.classList.contains('sidebar-open');
      if (event.detail === 0) layout.classList.add('sidebar-instant');
      layout.classList.toggle('sidebar-open', open);
      sidebar.setAttribute('aria-hidden', String(!open));
      toggle.setAttribute('aria-expanded', String(open));
      toggle.setAttribute('aria-label', open ? 'Fechar menu lateral' : 'Abrir menu lateral');
      toggle.title = toggle.getAttribute('aria-label');
      if (event.detail === 0) {
        requestAnimationFrame(() => requestAnimationFrame(() => layout.classList.remove('sidebar-instant')));
      }
    });
  })();
</script>

  // ═══════════════════════════════

  const VIEWS = ['video-ops'];
  let currentView = null;

  // Troca a tela visível (só existem telas de ferramenta)
  function activateView(view) {
    if (currentView === view || !VIEWS.includes(view)) return;
    currentView = view;
    VIEWS.forEach(v => { document.getElementById('view-' + v).hidden = v !== view; });
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('active', el.dataset.view === view);
    });
    if (view === 'video-ops' && window.videoOpsRefresh) window.videoOpsRefresh();
  }

  // Sidebar — abre a ferramenta do item clicado
  document.getElementById('sidebar').addEventListener('click', e => {
    const item = e.target.closest('[data-view]');
    if (item) activateView(item.dataset.view);
  });

  // ═══════════════════════════════
  //  APARÊNCIA — troca ao vivo, na tela em que o usuário já está
  // ═══════════════════════════════
  // Só reescreve <html data-appearance>: nada é remontado, nada é recarregado. O vídeo segue
  // tocando na mesma posição, o campo em edição segue com o texto digitado, a rolagem e o
  // foco ficam onde estavam — a cor é a ÚNICA coisa que muda.
  const apSelect = document.getElementById('appearance-select');
  if (apSelect && window.Appearance) {
    apSelect.value = window.Appearance.current();
    apSelect.addEventListener('change', () => {
      // set() devolve o que ficou valendo (pode ser o padrão, se o valor for inválido):
      // o campo mostra o estado real, não o pedido.
      apSelect.value = window.Appearance.set(apSelect.value);
    });
  }

  // ═══════════════════════════════
  //  ESTÚDIO FORA DO MOTOR
  // ═══════════════════════════════
  // O Estúdio só funciona servido pelo motor (video-worker/serve.py, porta 8765): é ele que
  // atende /api/*, /sources/ e /clips/. Aberto de outro lugar (o site publicado, ver
  // PASSO-A-PASSO.md), a tela vira um link para o motor. Sem o #video-ops-root o video-ops.js
  // não monta, então nenhuma chamada falha calada.
  if (location.port !== '8765') {
    document.getElementById('video-ops-root').remove();
    document.getElementById('estudio-local').hidden = false;
  }

  // ═══════════════════════════════
  //  INIT
  // ═══════════════════════════════
  activateView('video-ops');
</script>
